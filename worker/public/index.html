<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeli — Internal Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #07090c;
    --surface: #0c0f14;
    --border: #191f2a;
    --accent: #00d4ff;
    --text: #d8e4f0;
    --text-dim: #5a6a7a;
    --text-muted: #2a3a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .console {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 48px 24px;
  }

  .logo {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .tagline {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 64px;
  }

  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 32px 24px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    width: 100%;
    max-width: 340px;
    transition: border-color 0.2s, transform 0.15s;
  }

  .tile:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .tile-icon { font-size: 24px; line-height: 1; }

  .tile-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 5px;
  }

  .tile-desc {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .tile-arrow {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    align-self: flex-end;
  }

  .tile:hover .tile-arrow { color: var(--accent); }

  footer {
    padding: 24px;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="console">
  <div class="logo">Zeli</div>
  <div class="tagline">Internal Operations Console · Santiago, Panama</div>

  <a class="tile" href="/conversations">
    <div class="tile-icon">💬</div>
    <div>
      <div class="tile-name">Website Conversations</div>
      <div class="tile-desc">zeli.lat web chat sessions</div>
    </div>
    <div class="tile-arrow">→</div>
  </a>
</div>

<footer>Zeli Technologies · Cloudflare · confidential</footer>

</body>
</html>
